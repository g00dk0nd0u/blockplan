<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="BlockPlan sample workspace">
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="2" fill="#cfc8bd"/>
    </pattern>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#e8e5e0}.bar{fill:#f7f6f4;stroke:#d8d2c8}.btn{fill:#fbfaf8;stroke:#cfc8bd}.btnText{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#2b2b2b}.title{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#222}.panelTitle{font:700 15px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.08em;fill:#2b2b2b}.label{font:700 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#3d403f}.area{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#555}.zone{stroke:#6f7d78;stroke-width:2;rx:9;filter:url(#softShadow)}.office{fill:#b9c8af}.meeting{fill:#a8c1ce}.core{fill:#c9b0a2}.circ{fill:#d9d09a}.mep{fill:#b9adc7}.dashText{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#333}.dashSmall{font:700 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#777}.line{stroke:#d8d2c8;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="36" class="bar"/>
  <rect x="12" y="7" width="22" height="22" rx="5" fill="#4b7580"/>
  <circle cx="20" cy="15" r="2" fill="#e8e5e0"/><circle cx="27" cy="15" r="2" fill="#e8e5e0"/><circle cx="20" cy="22" r="2" fill="#e8e5e0"/><circle cx="27" cy="22" r="2" fill="#e8e5e0"/>
  <text x="43" y="25" class="title">BlockPlan</text>
  <g transform="translate(160 6)">
    <rect class="btn" x="0" y="0" width="92" height="24" rx="4"/><text class="btnText" x="14" y="16">↖ Select / Move</text>
    <rect class="btn" x="100" y="0" width="68" height="24" rx="4"/><text class="btnText" x="114" y="16">⧉ Copy</text>
    <rect class="btn" x="176" y="0" width="58" height="24" rx="4"/><text class="btnText" x="190" y="16">⌁ Cut</text>
    <rect class="btn" x="242" y="0" width="66" height="24" rx="4"/><text class="btnText" x="256" y="16">⌫ Erase</text>
    <rect class="btn" x="316" y="0" width="70" height="24" rx="4"/><text class="btnText" x="330" y="16">⊕ Merge</text>
    <rect class="btn" x="394" y="0" width="84" height="24" rx="4"/><text class="btnText" x="408" y="16">⟳ Rotate 90°</text>
  </g>
  <g transform="translate(1018 6)">
    <rect class="btn" x="0" y="0" width="72" height="24" rx="4"/><text class="btnText" x="12" y="16">Clear Plan</text>
    <rect x="96" y="0" width="72" height="24" rx="4" fill="#47798a"/><text class="btnText" x="110" y="16" fill="#fff">Save JSON</text>
    <rect class="btn" x="176" y="0" width="72" height="24" rx="4"/><text class="btnText" x="188" y="16">Load JSON</text>
  </g>
  <rect x="0" y="36" width="1020" height="684" fill="url(#dots)" opacity=".95"/>
  <rect x="1020" y="36" width="260" height="684" fill="#e8e5e0" stroke="#d8d2c8"/>

  <g transform="translate(104 130)">
    <rect class="zone core" x="0" y="0" width="132" height="88" rx="9"/><text class="label" x="66" y="38" text-anchor="middle">Core</text><text class="area" x="66" y="56" text-anchor="middle">77.8㎡</text>
    <rect class="zone mep" x="0" y="88" width="132" height="88" rx="9"/><text class="label" x="66" y="126" text-anchor="middle">MEP</text><text class="area" x="66" y="144" text-anchor="middle">77.8㎡</text>
    <rect class="zone meeting" x="176" y="0" width="92" height="132" rx="9"/><text class="label" x="222" y="58" text-anchor="middle">Meeting</text><text class="area" x="222" y="76" text-anchor="middle">77.8㎡</text>
    <rect class="zone meeting" x="268" y="0" width="220" height="132" rx="9"/><text class="label" x="378" y="58" text-anchor="middle">Meeting</text><text class="area" x="378" y="76" text-anchor="middle">194.4㎡</text>
    <rect class="zone meeting" x="488" y="0" width="220" height="132" rx="9"/><text class="label" x="598" y="58" text-anchor="middle">Meeting</text><text class="area" x="598" y="76" text-anchor="middle">194.4㎡</text>
    <rect class="zone office" x="708" y="0" width="88" height="88" rx="9"/><text class="label" x="752" y="38" text-anchor="middle">Office</text><text class="area" x="752" y="56" text-anchor="middle">51.8㎡</text>
    <rect class="zone office" x="708" y="88" width="88" height="88" rx="9"/><text class="label" x="752" y="126" text-anchor="middle">Office</text><text class="area" x="752" y="144" text-anchor="middle">51.8㎡</text>
    <rect class="zone circ" x="132" y="0" width="44" height="528" rx="9"/><rect class="zone circ" x="176" y="132" width="532" height="44" rx="0"/><rect class="zone circ" x="176" y="440" width="532" height="88" rx="9"/><text class="label" x="442" y="420" text-anchor="middle">Circulation</text><text class="area" x="442" y="438" text-anchor="middle">544.3㎡</text>
    <rect class="zone meeting" x="0" y="176" width="176" height="88" rx="9"/><text class="label" x="88" y="214" text-anchor="middle">Meeting</text><text class="area" x="88" y="232" text-anchor="middle">103.7㎡</text>
    <rect class="zone meeting" x="0" y="264" width="176" height="132" rx="9"/><text class="label" x="88" y="318" text-anchor="middle">Meeting</text><text class="area" x="88" y="336" text-anchor="middle">155.5㎡</text>
    <rect class="zone meeting" x="0" y="396" width="176" height="132" rx="9"/><text class="label" x="88" y="450" text-anchor="middle">Meeting</text><text class="area" x="88" y="468" text-anchor="middle">155.5㎡</text>
    <rect class="zone office" x="220" y="176" width="88" height="88" rx="9"/><text class="label" x="264" y="212" text-anchor="middle">Office</text><text class="area" x="264" y="230" text-anchor="middle">51.8㎡</text>
    <rect class="zone office" x="308" y="176" width="352" height="220" rx="9"/><text class="label" x="484" y="282" text-anchor="middle">Office</text><text class="area" x="484" y="300" text-anchor="middle">518.4㎡</text>
    <rect class="zone core" x="220" y="440" width="132" height="88" rx="9"/><text class="label" x="286" y="478" text-anchor="middle">Core</text><text class="area" x="286" y="496" text-anchor="middle">77.8㎡</text>
    <rect class="zone core" x="352" y="440" width="132" height="88" rx="9"/><text class="label" x="418" y="478" text-anchor="middle">Core</text><text class="area" x="418" y="496" text-anchor="middle">77.8㎡</text>
    <rect class="zone mep" x="484" y="440" width="176" height="88" rx="9"/><text class="label" x="572" y="478" text-anchor="middle">MEP</text><text class="area" x="572" y="496" text-anchor="middle">103.7㎡</text>
    <rect class="zone core" x="708" y="396" width="88" height="132" rx="9"/><text class="label" x="752" y="450" text-anchor="middle">Core</text><text class="area" x="752" y="468" text-anchor="middle">77.8㎡</text>
  </g>

  <g transform="translate(1038 70)">
    <text class="panelTitle" x="0" y="0">DASHBOARD</text><rect class="btn" x="220" y="-17" width="20" height="20" rx="4"/><text class="btnText" x="226" y="-2">＋</text>
    <text class="dashSmall" x="10" y="36">色</text><text class="dashSmall" x="34" y="36">CATEGORY</text><text class="dashSmall" x="146" y="36">AREA ㎡</text><text class="dashSmall" x="198" y="36">ZONES</text><text class="dashSmall" x="236" y="36">CELLS</text>
    <line class="line" x1="0" y1="48" x2="242" y2="48"/>
    <rect x="10" y="58" width="16" height="10" rx="2" fill="#d9d6d0" stroke="#aaa"/><text class="dashText" x="34" y="68">Unassigned</text><text class="dashText" x="156" y="68">0.00</text><text class="dashText" x="206" y="68">0</text><text class="dashText" x="238" y="68">0</text>
    <rect x="10" y="86" width="16" height="10" rx="2" fill="#b9c8af" stroke="#8fa184"/><text class="dashText" x="34" y="96">Office</text><text class="dashText" x="150" y="96">881.28</text><text class="dashText" x="206" y="96">7</text><text class="dashText" x="232" y="96">68</text>
    <rect x="10" y="114" width="16" height="10" rx="2" fill="#a8c1ce" stroke="#7897a6"/><text class="dashText" x="34" y="124">Meeting</text><text class="dashText" x="150" y="124">881.28</text><text class="dashText" x="206" y="124">6</text><text class="dashText" x="232" y="124">68</text>
    <rect x="10" y="142" width="16" height="10" rx="2" fill="#c9b0a2" stroke="#9f8070"/><text class="dashText" x="34" y="152">Core</text><text class="dashText" x="150" y="152">311.04</text><text class="dashText" x="206" y="152">4</text><text class="dashText" x="232" y="152">24</text>
    <rect x="10" y="170" width="16" height="10" rx="2" fill="#d9d09a" stroke="#b7ad6c"/><text class="dashText" x="34" y="180">Circulation</text><text class="dashText" x="150" y="180">544.32</text><text class="dashText" x="206" y="180">1</text><text class="dashText" x="232" y="180">42</text>
    <rect x="10" y="198" width="16" height="10" rx="2" fill="#b9adc7" stroke="#9183a2"/><text class="dashText" x="34" y="208">MEP</text><text class="dashText" x="150" y="208">181.44</text><text class="dashText" x="206" y="208">2</text><text class="dashText" x="232" y="208">14</text>
    <text class="panelTitle" x="0" y="260">PROJECT SETTINGS</text>
    <rect x="0" y="276" width="240" height="84" rx="4" fill="#eee9e1" stroke="#d8d2c8"/>
    <text class="dashText" x="12" y="300">Module size</text><rect class="btn" x="132" y="286" width="96" height="24" rx="4"/><text class="dashText" x="164" y="302">3600 mm</text>
    <line class="line" x1="0" y1="318" x2="240" y2="318"/><text class="dashText" x="12" y="338">Cell area</text><text class="dashText" x="184" y="338">12.96 ㎡</text>
  </g>
  <rect x="8" y="690" width="48" height="22" rx="4" fill="#f7f6f4" stroke="#d8d2c8"/><text x="20" y="705" class="dashText">161%</text>
</svg>
