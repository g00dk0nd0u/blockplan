<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BlockPlan is a fast browser-based pre-BIM zoning planner for sketching architectural planning zones on a grid.">
    <meta property="og:title" content="BlockPlan">
    <meta property="og:description" content="A lightweight web app for quick architectural zoning studies before BIM modeling.">
    <title>BlockPlan - Fast Pre-BIM Zoning Planner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%233A6272'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>BlockPlan</h1>
            <p>Fast pre-BIM zoning planner</p>
          </div>
        </div>

        <div class="tool-actions" aria-label="Tools">
          <button id="selectToolButton" type="button" class="tool-button" data-tool="select">
            <span class="tool-icon" aria-hidden="true">↖</span>
            <span class="tool-label">Select</span>
          </button>
          <button id="copyToolButton" type="button" class="tool-button" data-tool="copy">
            <span class="tool-icon" aria-hidden="true">⧉</span>
            <span class="tool-label">Copy</span>
          </button>
          <button id="cutToolButton" type="button" class="tool-button" data-tool="cut">
            <span class="tool-icon" aria-hidden="true">⌁</span>
            <span class="tool-label">Cut</span>
          </button>
          <button id="eraseToolButton" type="button" class="tool-button" data-tool="erase">
            <span class="tool-icon" aria-hidden="true">⌫</span>
            <span class="tool-label">Erase</span>
          </button>
          <button id="mergeToolButton" type="button" class="tool-button" data-tool="merge">
            <span class="tool-icon" aria-hidden="true">⊕</span>
            <span class="tool-label">Merge</span>
          </button>
          <button id="rotateToolButton" type="button" class="tool-button" data-tool="rotate">
            <span class="tool-icon" aria-hidden="true">⟳</span>
            <span class="tool-label">Rotate</span>
          </button>
        </div>

        <div class="file-actions" aria-label="File actions">
          <button id="clearButton" type="button">Clear Plan</button>
          <button id="saveJsonButton" type="button">Save JSON</button>
          <button id="loadJsonButton" type="button">Load JSON</button>
          <button id="exportPngButton" type="button">Export PNG</button>
          <button id="linkUnderlayButton" type="button">Link Underlay</button>
          <input id="loadJsonInput" type="file" accept="application/json,.json" hidden>
          <input id="underlayInput" type="file" accept="application/pdf,image/png,image/jpeg,image/svg+xml,image/webp,.pdf,.png,.jpg,.jpeg,.svg,.webp" hidden>
        </div>
      </header>

      <main class="canvas-panel" aria-label="Planning canvas">
        <div id="underlayLayer" class="underlay-layer" aria-hidden="true"></div>
        <canvas id="planningCanvas"></canvas>
        <div class="canvas-status">
          <span id="zoomStatus">100%</span>
          <span id="cellStatus">Cell 0, 0</span>
        </div>
      </main>

      <aside class="right-sidebar panel">
        <section>
          <div class="section-heading-row">
            <h2>Dashboard</h2>
            <button id="addCategoryButton" type="button" class="icon-button" title="Add category">＋</button>
          </div>
          <div id="dashboard" class="dashboard"></div>
        </section>

        <section>
          <h2>Underlay</h2>
          <div class="underlay-controls">
            <p id="underlayStatus" class="underlay-status">No underlay linked</p>
            <div class="underlay-action-row">
              <button id="replaceUnderlayButton" type="button" class="secondary-button" disabled>Replace</button>
              <button id="toggleUnderlayButton" type="button" class="secondary-button" disabled>Hide</button>
              <button id="lockUnderlayButton" type="button" class="secondary-button" disabled>Unlock</button>
            </div>
            <div class="underlay-action-row" aria-label="Underlay alignment tools">
              <button id="moveUnderlayButton" type="button" class="secondary-button" disabled>Move</button>
              <button id="scaleDownUnderlayButton" type="button" class="secondary-button" disabled>Scale -</button>
              <button id="scaleUpUnderlayButton" type="button" class="secondary-button" disabled>Scale +</button>
              <button id="rotateUnderlayButton" type="button" class="secondary-button" disabled>Rotate 90°</button>
              <button id="resetUnderlayButton" type="button" class="secondary-button" disabled>Reset</button>
              <button id="scaleByPointsUnderlayButton" type="button" class="secondary-button" disabled>Scale by 2 pts</button>
            </div>
            <label class="underlay-field">
              <span>Opacity</span>
              <input id="underlayOpacity" type="range" min="0" max="100" value="50" disabled>
              <output id="underlayOpacityValue">50%</output>
            </label>
            <p class="help-copy">Linked files are references only. JSON stores metadata, not file contents.</p>
          </div>
        </section>

        <section>
          <h2>Project Settings</h2>
          <dl class="settings-list">
            <div>
              <dt>Module size</dt>
              <dd>
                <select id="moduleSize" class="settings-select" aria-label="Module size">
                  <option value="300">300 mm</option>
                  <option value="600">600 mm</option>
                  <option value="1200">1200 mm</option>
                  <option value="1800">1800 mm</option>
                  <option value="2400">2400 mm</option>
                  <option value="3600" selected>3600 mm</option>
                  <option value="4800">4800 mm</option>
                  <option value="7200">7200 mm</option>
                  <option value="9600">9600 mm</option>
                </select>
              </dd>
            </div>
            <div>
              <dt>Cell area</dt>
              <dd id="cellAreaReadout">12.96 ㎡</dd>
            </div>
            <div>
              <dt>Saved state</dt>
              <dd id="saveStatus">Ready</dd>
            </div>
          </dl>
        </section>
      </aside>
    </div>

    <script src="app.js"></script>
    <script src="interaction-patch.js"></script>
  </body>
</html>
